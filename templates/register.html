<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Регистрация</h1>

        {% if error %}
            <p style="color: #dc2626; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}

        <form method="post">
            <div class="form-group">
                <label>Ник:</label>
                <input type="text" name="username" required minlength="3" placeholder="Придумай ник">
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" name="password" required minlength="4">
            </div>
            <div class="form-group">
                <label>Повтори пароль:</label>
                <input type="password" name="password2" required minlength="4">
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>

        <p style="margin-top: 20px;">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
</body>
</html>
