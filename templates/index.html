{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Тренировка</h1>
  {% if user %}
  <form action="/start" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="form-group">
      <label class="check">
        <input type="checkbox" name="general" value="1" id="generalCheckbox" checked>
        <span>Общий тест</span>
      </label>
    </div>
    <div class="form-group">
      <p class="muted" style="margin-bottom:8px">Или отдельные темы:</p>
      <div class="topics">
        {% for topic in topics %}
        <label class="check">
          <input type="checkbox" name="topics" value="{{ topic }}" class="topic-checkbox">
          <span>{{ topic }}</span>
        </label>
        {% endfor %}
      </div>
    </div>
    <div class="form-group">
      <p class="muted" style="margin-bottom:8px">Сложность:</p>
      <div class="topics">
        <label class="check"><input type="radio" name="difficulty" value="" checked><span>Любая</span></label>
        <label class="check"><input type="radio" name="difficulty" value="Лёгкий"><span>Лёгкий</span></label>
        <label class="check"><input type="radio" name="difficulty" value="Средний"><span>Средний</span></label>
        <label class="check"><input type="radio" name="difficulty" value="Сложный"><span>Сложный</span></label>
      </div>
    </div>
    <div class="form-group">
      <label>Количество вопросов
        <input type="number" name="count" value="20" min="5" max="100" style="width:100px">
      </label>
    </div>
    <button type="submit" class="btn">Начать</button>
  </form>
  {% else %}
  <p class="muted"><a href="/login">Войдите</a>, чтобы проходить тесты.</p>
  {% endif %}
</div>
<script>
const g=document.getElementById('generalCheckbox');
const ts=document.querySelectorAll('.topic-checkbox');
if(g){g.onchange=()=>{if(g.checked)ts.forEach(c=>c.checked=false)};
ts.forEach(c=>c.onchange=()=>{if(c.checked)g.checked=false});}
</script>
{% endblock %}
