<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по ИБ</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Шапка -->
            <div class="header">
                <h1>Подготовка к защите по ИБ</h1>
                <div class="header-actions">
                    {% if user %}
                        <span>Привет, <b>{{ user.username }}</b></span>
                        <a href="/profile" class="btn">Профиль</a>
                        <a href="/logout" class="btn btn-gray">Выйти</a>
                    {% else %}
                        <a href="/login" class="btn">Войти</a>
                        <a href="/register" class="btn btn-gray">Регистрация</a>
                    {% endif %}
                </div>
            </div>

            {% if user %}
            <form action="/start" method="post" id="startForm">

                <!-- Режим экзамена -->
                <div class="form-group">
                    <label>Режим</label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="marathon" value="true">
                        <span>Экзамен (больше вопросов)</span>
                    </label>
                </div>

                <!-- Выбор тем -->
                <div class="form-group">
                    <label>Выберите темы</label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="topics" value="general" id="generalCheckbox">
                        <span><b>Общий тест</b> (все темы)</span>
                    </label>

                    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                        {% for topic in topics %}
                        <label class="checkbox-item">
                            <input type="checkbox" name="topics" value="{{ topic }}" class="topic-checkbox">
                            <span>{{ topic }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">
                    Начать тест
                </button>
            </form>

                {% else %}
    <div style="text-align: center; padding: 30px 10px;">
        <p style="margin-bottom: 8px; font-size: 16px; color: #64748b;">
            Чтобы проходить тесты, нужно войти в аккаунт
        </p>
    </div>
            {% endif %}
        </div>
    </div>

    <script>
        const generalCheckbox = document.getElementById('generalCheckbox');
        const topicCheckboxes = document.querySelectorAll('.topic-checkbox');

        if (generalCheckbox) {
            generalCheckbox.addEventListener('change', () => {
                if (generalCheckbox.checked) {
                    topicCheckboxes.forEach(cb => cb.checked = false);
                }
            });

            topicCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) {
                        generalCheckbox.checked = false;
                    }
                });
            });
        }
    </script>
</body>
</html>
