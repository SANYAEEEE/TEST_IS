{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Выбор теста</h1>

    {% if user %}
    <form action="/start" method="post" id="startForm">
        <div class="form-group">
            <label class="mode-label">
                <input type="radio" name="mode" value="practice" checked>
                Обычный режим <span class="muted">(таймер только считает время)</span>
            </label>
            <label class="mode-label">
                <input type="radio" name="mode" value="exam">
                Экзамен <span class="muted">(лимит 20 минут)</span>
            </label>
        </div>

        <div class="form-group">
            <label class="checkbox-item">
                <input type="checkbox" name="general" value="1" id="generalCheckbox" checked>
                <span>Общий тест (все темы)</span>
            </label>
        </div>

        <div class="form-group">
            <p class="muted" style="margin-bottom: 8px;">Или выберите отдельные темы:</p>
            <div class="topics-grid">
                {% for topic in topics %}
                <label class="checkbox-item">
                    <input type="checkbox" name="topics" value="{{ topic }}" class="topic-checkbox">
                    <span>{{ topic }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label>Количество вопросов
                <input type="number" name="count" value="20" min="5" max="100" style="width: 100px;">
            </label>
        </div>

        <button type="submit" class="btn">Начать тест</button>
    </form>
    {% else %}
    <p class="center-msg">
        Чтобы проходить тесты, нужно <a href="/login">войти</a> или <a href="/register">зарегистрироваться</a>.
    </p>
    {% endif %}
</div>

<script>
const generalCheckbox = document.getElementById('generalCheckbox');
const topicCheckboxes = document.querySelectorAll('.topic-checkbox');

if (generalCheckbox) {
    generalCheckbox.addEventListener('change', () => {
        if (generalCheckbox.checked) {
            topicCheckboxes.forEach(cb => cb.checked = false);
        }
    });
    topicCheckboxes.forEach(cb => {
        cb.addEventListener('change', () => {
            if (cb.checked) generalCheckbox.checked = false;
        });
    });
}
</script>
{% endblock %}
