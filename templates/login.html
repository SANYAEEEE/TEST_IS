<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card" style="max-width: 420px; margin: 40px auto;">
            <h1 style="text-align: center; margin-bottom: 20px;">Вход</h1>

            {% if error %}
                <div style="background: #fef2f2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label>Ник</label>
                    <input type="text" name="username" required placeholder="Ваш ник">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="Пароль">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Войти</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                Нет аккаунта? <a href="/register" style="color: var(--primary);">Зарегистрироваться</a>
            </p>
            <p style="text-align: center; margin-top: 10px;">
                <a href="/" style="color: #64748b; font-size: 13px;">← На главную</a>
            </p>
        </div>
    </div>
</body>
</html>
