{% extends "base.html" %}
{% block title %}Экзамен{% endblock %}

{% block content %}
<div class="card">
  <h1>Экзамен</h1>
  <p class="muted">25 вопросов · 20 минут</p>

  {% if user %}
  <form action="/exam/start" method="post">
    <div class="form-group">
      <div class="topics">
        {% for t in exam_topics %}
        <label class="check">
          <input type="radio" name="topic" value="{{ t }}" required>
          <span>{{ t }}</span>
        </label>
        {% endfor %}
      </div>
    </div>
    <button type="submit" class="btn">Начать экзамен</button>
  </form>
  {% else %}
  <p class="muted"><a href="/login">Войдите</a>, чтобы сдать экзамен.</p>
  {% endif %}
</div>
{% endblock %}
