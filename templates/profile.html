<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль: {{ username }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📊 История тестов: {{ username }}</h1>
            <a href="/" class="btn" style="background: #64748b; text-decoration: none; display: inline-block; margin-bottom: 20px;">На главную</a>

            {% if results %}
                <table style="width: 100%; border-collapse: collapse;">
                    <tr style="border-bottom: 2px solid var(--border); text-align: left;">
                        <th style="padding: 10px;">Дата</th>
                        <th style="padding: 10px;">Тема</th>
                        <th style="padding: 10px;">Баллы</th>
                        <th style="padding: 10px;">Действия</th>
                    </tr>
                    {% for r in results %}
                    <tr style="border-bottom: 1px solid var(--border);">
                        <td style="padding: 10px;">{{ r.date }}</td>
                        <td style="padding: 10px;">{{ r.topic }}</td>
                        <td style="padding: 10px;"><b>{{ r.score }} / {{ r.max_score }}</b></td>
                        <td style="padding: 10px;">
                            <a href="/result/{{ r.id }}" style="color: var(--primary-dark);">Посмотреть</a>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            {% else %}
                <p>Вы еще не проходили тесты. <a href="/">Начните сейчас!</a></p>
            {% endif %}
        </div>
    </div>
</body>
</html>
